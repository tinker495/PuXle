[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "puxle"
version = "0.2.0"
description = "Parallelized puzzle and planning environments built on JAX."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "tinker495", email = "wjdrbtjr495@gmail.com" },
]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "aqtp>=0.9.0",
    "cayleypy==0.1.0",
    "chex>=0.1.0",
    "flax>=0.11.2",
    "huggingface-hub>=0.20.0",
    "jax>=0.11.2",
    "numpy>=2.2.0",
    "opencv-python-headless>=4.10.0",
    "optax>=0.2.0",
    "pddl>=0.4.3",
    "Pillow>=9.0.0",
    "tqdm>=4.66",
    "tyro>=1.0.16,<2",
    "xtructure @ git+https://github.com/tinker495/xtructure.git@main",
]

[project.urls]
Homepage = "https://github.com/tinker495/PuXle"
Documentation = "https://tinker495.github.io/PuXle/"
Repository = "https://github.com/tinker495/PuXle"
Issues = "https://github.com/tinker495/PuXle/issues"

[project.scripts]
puxle = "puxle.cli:main"

[project.optional-dependencies]
cuda = [
    "jax[cuda]>=0.11.2",
]
docs = [
    "sphinx>=7.0",
    "furo",
    "sphinx-autodoc-typehints",
    "myst-parser",
]

[tool.setuptools]
include-package-data = true

[dependency-groups]
dev = [
    "pre-commit>=3.0.0",
    "pyrefly==1.4.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.15.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["puxle*"]

[tool.setuptools.package-data]
puxle = [
    "data/**/*.csv",
    "data/**/*.json",
    "data/**/*.npy",
    "data/**/*.pddl",
    "data/**/*.pkl",
    "data/**/*.png",
]

[tool.pytest.ini_options]
testpaths = ["tests", "."]
pythonpath = ["."]
addopts = "-v --tb=short --maxfail=1"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
per-file-ignores = { "__init__.py" = ["F401"] }
